name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.13 起 node:sqlite 不再需要 --experimental-sqlite（读取 cc-switch 的库要用）
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 清单测试里的「桌面 profile 已安装」一项在 CI 上没有 profile，会自动跳过
      - run: npm test