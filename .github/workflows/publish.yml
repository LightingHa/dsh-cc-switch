# 通过 npm Trusted Publishing（GitHub Actions OIDC）发布，不需要任何长期令牌，
# 也不受「bypass 2FA 令牌禁止直接发布（2027-01 生效）」的限制。
#
# 前置条件（在 npm 网站配置一次）：
#   https://www.npmjs.com/package/dsh-cc-switch/access
#   → Trusted Publisher → GitHub Actions
#       Organization or user : LightingHa
#       Repository           : dsh-cc-switch
#       Workflow filename    : publish.yml
#       Environment name     : （留空）
#
# 之后每次发布：在 GitHub 上发一个 Release（或在 Actions 页面手动触发本工作流），
# 工作流会先跑测试再发布，全程不需要 token。

name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Trusted Publishing 必需：用于向 npm 换取临时发布凭证

jobs:
  publish:
    # 只在本人仓库触发，避免 fork 上的误操作
    if: github.repository_owner == 'LightingHa'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 跑测试（82 个）
        run: npm test

      - name: 发布到 npm（OIDC 换临时凭证，无令牌）
        run: npm publish --provenance --access public